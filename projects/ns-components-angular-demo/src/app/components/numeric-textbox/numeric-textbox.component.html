<div class="box box-danger box-border screen-center-box">
    <div class="box-header with-border">
        <i class="fa fa-hand-o-right"></i>
        <h3 class="box-title">Demo</h3>
    </div>
    <div class="box-body">
        <div class="text-center">
            <div class="form-group form-group-sm" style="padding-left: 20px; padding-right: 20px;">
                <ns-numeric-textbox-angular id="txtNumericTextbox" [setting]="setting" 
                [(ngModel)]="amount" 
                (formatValueChanged)="displayCashAmount = $event;" 
                #txtDemo >
                </ns-numeric-textbox-angular>
            </div>
        </div>
    </div>
</div>
