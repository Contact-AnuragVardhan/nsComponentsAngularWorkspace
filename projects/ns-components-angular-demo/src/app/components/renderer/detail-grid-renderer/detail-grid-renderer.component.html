<div class="detail-grid-container"
  [ngStyle]="{ height: '100%', backgroundColor: '#EDF6FF', padding: '20px', boxSizing: 'border-box' }">
  <div class="header" style="height: 10%; padding: 2px; font-weight: bold;">
    This Grid is for Id {{ data?.id }}
  </div>
  <div class="grid-container" style="width: 100%; height: 350px;">
    <ns-grid-angular [setting]="gridSetting" [dataSource]="dataSource"
      style="width: 100%; height: 100%;"></ns-grid-angular>
  </div>
</div>
