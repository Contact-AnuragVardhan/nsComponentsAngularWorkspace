<div class="realTimeCell" #elementRef style="width: 100%;">
    <i [class]="'fa ' + (delta == null ? '' : (deltaUp ? 'fa-arrow-up realTimeCellDeltaUp' : 'fa-arrow-down realTimeCellDeltaDown'))"></i>
    &nbsp;
    <span [class]="'realTimeCellDelta ' + (deltaUp ? 'realTimeCellDeltaUp' : 'realTimeCellDeltaDown')">
        {{ delta }}
    </span>
    <span [class]="'realTimeCellValue ' + (delta == null ? '' : 'realTimeCellValueHighlight')">
        {{ value }}
    </span>
</div>
